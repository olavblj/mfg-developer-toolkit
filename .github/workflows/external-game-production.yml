name: Build an MFG preview
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      version:
        required: true
        type: string
permissions: {}
jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "12.4.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - run: pnpm install --frozen-lockfile
      - name: Build for the reviewed MFG shell origin
        env:
          VITE_MFG_SHELL_ORIGIN: "https://memefreegames.com"
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mfg-build
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: "olavblj/mfg-developer-toolkit"
          ref: "9d3238f944fa41fcee1af74d25658641a0e46f80"
          path: trusted
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "12.4.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Install the pinned uploader without lifecycle scripts
        working-directory: trusted/uploader
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mfg-build
          path: inert-build
      - name: Validate inert files and upload a private preview
        working-directory: trusted/uploader
        env:
          MFG_PROJECT: ${{ inputs.project }}
          MFG_VERSION: ${{ inputs.version }}
          MFG_API: "https://memefreegames.com/api"
          MFG_DEPLOY_AUDIENCE: "https://memefreegames.com"
        run: pnpm exec mfg-upload --api "$MFG_API" --project "$MFG_PROJECT" --version "$MFG_VERSION" --dist "$GITHUB_WORKSPACE/inert-build"
